name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Run unit tests
      run: npm run test:unit

  e2e:
    name: E2E tests (Snowflake)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Write Snowflake credentials
      if: env.SNOWFLAKE_ACCOUNT != ''
      env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_HOST: ${{ secrets.SNOWFLAKE_HOST }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      run: |
        cat > test/e2e/fixtures/.cdsrc-private.json << EOF
        {
          "cds": {
            "requires": {
              "db": {
                "kind": "snowflake",
                "impl": "../../../dist/index.js",
                "credentials": {
                  "account": "${SNOWFLAKE_ACCOUNT}",
                  "host": "${SNOWFLAKE_HOST}",
                  "user": "${SNOWFLAKE_USER}",
                  "role": "${SNOWFLAKE_ROLE}",
                  "warehouse": "${SNOWFLAKE_WAREHOUSE}",
                  "database": "${SNOWFLAKE_DATABASE}",
                  "schema": "${SNOWFLAKE_SCHEMA}",
                  "auth": "jwt",
                  "jwt": {
                    "privateKey": "${SNOWFLAKE_PRIVATE_KEY}"
                  }
                }
              }
            }
          }
        }
        EOF

    - name: Run E2E tests
      if: env.SNOWFLAKE_ACCOUNT != ''
      env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      run: npm run test:e2e

    - name: Skip E2E (no credentials)
      if: env.SNOWFLAKE_ACCOUNT == ''
      env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      run: echo "Skipping E2E tests — Snowflake secrets not configured"

  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Check build artifacts
      run: |
        test -d dist
        test -f dist/index.js
        test -f dist/index.d.ts

    - name: Verify package
      run: npm pack --dry-run
